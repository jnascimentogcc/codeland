[project]
name = "codeland-analyzer"
version = "0.1.0"
description = "Builds the Codeland city model (schema/city-model.schema.json) from a TypeScript repository."
requires-python = ">=3.11"
dependencies = [
    # 0.26.0 crashes (access violation) while walking larger trees on Windows.
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
codeland-analyze = "codeland_analyzer.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeland_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
